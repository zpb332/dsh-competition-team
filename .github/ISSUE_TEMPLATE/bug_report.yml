name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please include enough detail to reproduce the problem.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: The version shown in DSH settings, or the desktop runtime version.
      placeholder: 0.2.2-rc.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a team...
        2. Confirm...
        3. Click...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Paste the panel error, browser console, or `team.json` snippet. Remove secrets first.
    validations:
      required: true
