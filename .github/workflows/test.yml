name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-concurrency=1 2>&1 | tee test-output.log
      - name: Test output on failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### Test output (tail)'
            echo '```'
            tail -n 120 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          if [ -f test-output.log ]; then
            tail -n 20 test-output.log | while IFS= read -r line; do
              echo "::error title=test-output::$line"
            done
          fi
      - run: npm pack --dry-run
